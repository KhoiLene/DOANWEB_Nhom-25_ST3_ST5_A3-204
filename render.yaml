services:
  - type: web
    name: techtra-beauty
    runtime: docker
    region: singapore
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: QDRANT_HOST
        sync: false
      - key: QDRANT_GRPC_PORT
        value: "6334"
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_USE_TLS
        value: "true"
      - key: SPRING_DOCKER_COMPOSE_ENABLED
        value: "false"
      - key: SPRING_AI_VECTORSTORE_QDRANT_INITIALIZE_SCHEMA
        value: "false"
      - key: SPRING_THYMELEAF_CACHE
        value: "true"
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
