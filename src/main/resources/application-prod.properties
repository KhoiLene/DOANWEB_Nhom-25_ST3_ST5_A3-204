# Production profile: all signing keys and database credentials must come from the host environment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.docker.compose.enabled=false
spring.jpa.show-sql=false
# Production uses the already-migrated database schema; enable schema changes only during a planned bootstrap/migration.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.sql.init.mode=${SPRING_SQL_INIT_MODE:never}
spring.sql.init.continue-on-error=true
spring.thymeleaf.cache=true
spring.ai.vectorstore.qdrant.initialize-schema=false

# Neon PostgreSQL pooler optimizations
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.default_schema=public
spring.datasource.hikari.data-source-properties.sslmode=require
spring.datasource.hikari.data-source-properties.prepareThreshold=0
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=${HIKARI_CONNECTION_TIMEOUT_MS:10000}
spring.datasource.hikari.keepalive-time=${HIKARI_KEEPALIVE_TIME_MS:0}

# Render Free has limited CPU and memory; cap request concurrency to avoid thread and heap pressure.
server.tomcat.threads.max=${SERVER_TOMCAT_THREADS_MAX:24}
server.tomcat.threads.min-spare=${SERVER_TOMCAT_THREADS_MIN_SPARE:2}
server.tomcat.accept-count=${SERVER_TOMCAT_ACCEPT_COUNT:32}
server.tomcat.max-connections=${SERVER_TOMCAT_MAX_CONNECTIONS:96}
