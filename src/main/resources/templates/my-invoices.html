<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biên nhận của tôi</title><style>body{font:15px Arial,sans-serif;background:#f8f7f9;color:#282336}.wrap{max-width:980px;margin:36px auto;background:#fff;padding:28px;border-radius:14px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:12px;border-bottom:1px solid #eee}a{color:#743b73}</style></head><body><main class="wrap"><h1>Biên nhận của tôi</h1><p><a th:href="@{/profile}">Quay lại tài khoản</a></p><table><thead><tr><th>Mã biên nhận</th><th>Ngày</th><th>Chi nhánh</th><th>Tổng tiền</th><th></th></tr></thead><tbody><tr th:each="invoice : ${invoices}"><td th:text="${invoice.invoiceNumber}">WEB-1</td><td th:text="${#temporals.format(invoice.issuedAt,'dd/MM/yyyy HH:mm')}">Ngày</td><td th:text="${invoice.order.store.name}">Chi nhánh</td><td th:text="${#numbers.formatDecimal(invoice.totalAmount,1,'COMMA',0,'POINT')} + ' ₫'">0 ₫</td><td><a th:href="@{/my/invoices/{id}(id=${invoice.id})}">Xem / in</a></td></tr><tr th:if="${#lists.isEmpty(invoices)}"><td colspan="5">Chưa có biên nhận đã phát hành. Biên nhận trực tuyến được phát hành sau khi xác nhận thanh toán.</td></tr></tbody></table></main></body></html>
