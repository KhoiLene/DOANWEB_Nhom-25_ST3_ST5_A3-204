<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gửi mã thành công - KL Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <th:block th:replace="~{fragments/header :: header-assets}"></th:block>
    <th:block th:replace="~{fragments/footer :: footer-assets}"></th:block>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh;">
  <div th:replace="~{fragments/header :: header}"></div>

  <main class="auth-page" style="align-items: center; justify-content: center; flex-grow: 1;">
    <div class="auth-form-wrap" style="text-align: center; max-width: 500px;">
        <div class="auth-form" style="padding: 40px;">
            <div style="font-size: 4rem; color: var(--primary); margin-bottom: 20px;">
                <i class="fa-solid fa-envelope-open-text"></i>
            </div>
            <h2 class="auth-form__heading">Đã gửi mã xác nhận!</h2>
            <p class="auth-form__sub" style="margin-bottom: 30px;" th:text="${message}">
                Chúng tôi đã gửi mã OTP đến email của bạn. Vui lòng nhập mã để đặt lại mật khẩu.
            </p>
            <a th:href="@{/forgot-password}" class="btn btn-primary">Quay lại nhập mã</a>
        </div>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
