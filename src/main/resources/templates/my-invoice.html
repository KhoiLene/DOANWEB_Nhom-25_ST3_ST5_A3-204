<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Biên nhận</title><style>body{font:15px Arial,sans-serif;color:#282336;background:#f8f7f9}.paper{max-width:760px;margin:36px auto;background:white;padding:36px;box-shadow:0 4px 24px #0001}header{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding-bottom:16px}.muted{color:#777}table{width:100%;border-collapse:collapse;margin:24px 0}th,td{text-align:left;padding:11px 7px;border-bottom:1px solid #eee}.num{text-align:right}.total{font-size:20px;font-weight:bold;text-align:right}.actions{text-align:center;margin:18px}@media print{body{background:#fff}.paper{margin:0 auto;box-shadow:none}.actions{display:none}}</style></head><body><main class="paper"><header><div><h1>Biên nhận đơn hàng</h1><p th:text="${invoice.order.store.name}">Chi nhánh</p></div><div class="num"><strong th:text="${invoice.invoiceNumber}">Mã</strong><p th:text="${#temporals.format(invoice.issuedAt,'dd/MM/yyyy HH:mm')}">Ngày</p></div></header><p>Khách hàng: <span th:text="${invoice.customerName ?: 'Khách hàng'}">Khách</span></p><p>Số điện thoại: <span th:text="${invoice.customerPhone ?: '—'}">—</span></p><table><thead><tr><th>Sản phẩm</th><th>Mã</th><th class="num">SL</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th></tr></thead><tbody><tr th:each="line : ${invoice.lines}"><td th:text="${line.productName}">Tên</td><td th:text="${line.sku ?: '—'}">SKU</td><td class="num" th:text="${line.quantity}">1</td><td class="num" th:text="${#numbers.formatDecimal(line.unitPrice,1,'COMMA',0,'POINT')} + ' ₫'">Giá</td><td class="num" th:text="${#numbers.formatDecimal(line.lineTotal,1,'COMMA',0,'POINT')} + ' ₫'">Tổng</td></tr></tbody></table><p class="num">Tạm tính: <span th:text="${#numbers.formatDecimal(invoice.subtotal,1,'COMMA',0,'POINT')} + ' ₫'">0</span></p><p class="num">Thuế: <span th:text="${#numbers.formatDecimal(invoice.taxAmount,1,'COMMA',0,'POINT')} + ' ₫'">0</span></p><p class="total">Đã thanh toán: <span th:text="${#numbers.formatDecimal(invoice.totalAmount,1,'COMMA',0,'POINT')} + ' ₫'">0</span></p><p class="muted">Đây là biên nhận bán hàng nội bộ.</p><div class="actions"><button onclick="window.print()">In biên nhận</button> · <a th:href="@{/my/invoices}">Danh sách biên nhận</a></div></main></body></html>
