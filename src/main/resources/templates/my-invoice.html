<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Biên nhận | Techtra Beauty</title><link rel="stylesheet" th:href="@{/css/workspace.css}">
<style>.receipt{max-width:760px;margin:36px auto;padding:36px;background:#fff;border:1px solid #dbe4f0;border-radius:14px;box-shadow:0 8px 24px rgba(37,99,235,.08)}.receipt__head{display:flex;justify-content:space-between;gap:20px;border-bottom:2px solid #d2a45c;padding-bottom:18px}.receipt__meta{text-align:right;color:#5a6b7d}.receipt table{width:100%;border-collapse:collapse;margin:24px 0}.receipt th,.receipt td{padding:11px 7px;border-bottom:1px solid #dbe4f0;text-align:left}.receipt .num{text-align:right}.receipt__total{text-align:right;font:700 1.2rem Montserrat,sans-serif;color:#2563eb}.receipt__actions{text-align:center;margin:20px}.receipt__note{color:#5a6b7d}@media print{body{background:#fff!important}.receipt{margin:0 auto;border:0;border-radius:0;box-shadow:none}.receipt__actions{display:none}}</style></head>
<body class="workspace-body"><main class="receipt"><header class="receipt__head"><div><a class="portal-brand" th:href="@{/}"><span>TECHTRA</span><strong>BEAUTY</strong></a><h1>Biên nhận đơn hàng</h1><p th:text="${invoice.order.store.name}">Chi nhánh</p></div><div class="receipt__meta"><strong th:text="${invoice.invoiceNumber}">Mã biên nhận</strong><p th:text="${#temporals.format(invoice.issuedAt,'dd/MM/yyyy HH:mm')}">Ngày</p></div></header>
<p>Khách hàng: <span th:text="${invoice.customerName ?: 'Khách hàng'}">Khách</span></p><p>Số điện thoại: <span th:text="${invoice.customerPhone ?: '—'}">—</span></p>
<table><thead><tr><th>Sản phẩm</th><th>SKU</th><th class="num">SL</th><th class="num">Đơn giá</th><th class="num">Thành tiền</th></tr></thead><tbody><tr th:each="line : ${invoice.lines}"><td th:text="${line.productName}">Tên</td><td th:text="${line.sku ?: '—'}">SKU</td><td class="num" th:text="${line.quantity}">1</td><td class="num" th:text="${#numbers.formatDecimal(line.unitPrice,1,'COMMA',0,'POINT')} + ' ₫'">Giá</td><td class="num" th:text="${#numbers.formatDecimal(line.lineTotal,1,'COMMA',0,'POINT')} + ' ₫'">Tổng</td></tr></tbody></table>
<p class="num">Tạm tính: <span th:text="${#numbers.formatDecimal(invoice.subtotal,1,'COMMA',0,'POINT')} + ' ₫'">0</span></p><p class="num">Thuế: <span th:text="${#numbers.formatDecimal(invoice.taxAmount,1,'COMMA',0,'POINT')} + ' ₫'">0</span></p><p class="receipt__total">Đã thanh toán: <span th:text="${#numbers.formatDecimal(invoice.totalAmount,1,'COMMA',0,'POINT')} + ' ₫'">0</span></p><p class="receipt__note">Đây là biên nhận bán hàng nội bộ.</p>
<div class="receipt__actions"><button type="button" onclick="window.print()">Tải / in PDF</button> <a class="workspace-button workspace-button--secondary" th:href="@{/my/invoices}">Danh sách biên nhận</a></div></main></body></html>
