<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Đơn xử lý tại kho</title><link rel="stylesheet" th:href="@{/css/admin/style.css}"></head><body><main class="admin-content" style="max-width:1200px;margin:30px auto;padding:20px"><h1>Đơn hàng cần xử lý tại kho</h1><p th:text="${warehouse.name}">Kho</p><a th:href="@{/warehouse/inventory}">Quản lý tồn kho</a><div class="card"><div class="card__body"><table class="admin-table"><thead><tr><th>Mã đơn</th><th>Người nhận</th><th>Địa chỉ</th><th>Sản phẩm</th><th>Tổng</th><th>Trạng thái</th><th>Cập nhật</th></tr></thead><tbody><tr th:each="order : ${orders}"><td th:text="${order.id}">1</td><td><span th:text="${order.customerName}">Khách</span><br><small th:text="${order.customerPhone}">SĐT</small></td><td><span th:text="${order.deliveryAddress}">Địa chỉ</span><br><small th:text="${order.deliveryCity}">Tỉnh</small></td><td><div th:each="line : ${order.orderItems}" th:text="${line.product.name + ' × ' + line.quantity}">Sản phẩm</div></td><td th:text="${#numbers.formatDecimal(order.totalAmount,1,'COMMA',0,'POINT')} + ' ₫'">0</td><td th:text="${order.status}">PENDING</td><td><form th:if="${order.status == 'PENDING'}" th:action="@{/warehouse/orders/{id}/status(id=${order.id})}" method="post"><input type="hidden" name="status" value="PROCESSING"><button type="submit">Nhận xử lý</button></form><form th:if="${order.status == 'PROCESSING'}" th:action="@{/warehouse/orders/{id}/status(id=${order.id})}" method="post"><input type="hidden" name="status" value="SHIPPING"><button type="submit">Bàn giao vận chuyển</button></form><form th:if="${order.status == 'SHIPPING'}" th:action="@{/warehouse/orders/{id}/status(id=${order.id})}" method="post"><input type="hidden" name="status" value="DELIVERED"><button type="submit">Xác nhận giao</button></form></td></tr><tr th:if="${#lists.isEmpty(orders)}"><td colspan="7">Chưa có đơn được chuyển về kho.</td></tr></tbody></table></div></div></main></body></html>
