<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Đơn kho | Techtra Beauty</title><link rel="stylesheet" th:href="@{/css/workspace.css}"><link rel="stylesheet" th:href="@{/css/assistant-widget.css}"><script defer th:src="@{/js/assistant-widget.js}"></script></head>
<body class="workspace-body">
<th:block th:replace="~{fragments/portal-header :: header('Nhân viên kho', ${warehouse.name})}"></th:block>
<main class="workspace-page">
    <div class="workspace-page__heading"><div><h1>Đơn hàng cần xử lý tại kho</h1><p>Đơn từ khu vực ngoài phạm vi chi nhánh sẽ xuất hiện tại đây.</p></div></div>
    <nav class="workspace-tabs"><a th:href="@{/warehouse/inventory}">Tồn kho & nhập hàng</a><a class="active" th:href="@{/warehouse/orders}">Đơn giao từ kho</a><a th:href="@{/}">Cửa hàng trực tuyến</a></nav>
    <section class="card"><div class="card__body workspace-table-wrap"><table class="admin-table"><thead><tr><th>Mã đơn</th><th>Người nhận</th><th>Địa chỉ</th><th>Sản phẩm</th><th>Tổng</th><th>Trạng thái</th><th>Cập nhật</th></tr></thead><tbody>
        <tr th:each="order : ${orders}"><td th:text="${'#' + order.id}">#1</td><td><span th:text="${order.customerName}">Khách</span><br><small th:text="${order.customerPhone}">SĐT</small></td><td><span th:text="${order.deliveryAddress}">Địa chỉ</span><br><small th:text="${order.deliveryCity}">Tỉnh</small></td><td><div th:each="line : ${order.orderItems}" th:text="${line.product.name + ' × ' + line.quantity}">Sản phẩm</div></td><td th:text="${#numbers.formatDecimal(order.totalAmount,1,'COMMA',0,'POINT')} + ' ₫'">0 ₫</td><td><span class="workspace-status" th:text="${order.status}">PENDING</span></td><td><form th:if="${order.status == 'PENDING'}" th:action="@{/warehouse/orders/{id}/status(id=${order.id})}" method="post"><input type="hidden" name="status" value="PROCESSING"><button type="submit">Nhận xử lý</button></form><form th:if="${order.status == 'PROCESSING'}" th:action="@{/warehouse/orders/{id}/status(id=${order.id})}" method="post"><input type="hidden" name="status" value="SHIPPING"><button type="submit">Bàn giao giao hàng</button></form><form th:if="${order.status == 'SHIPPING'}" th:action="@{/warehouse/orders/{id}/status(id=${order.id})}" method="post"><input type="hidden" name="status" value="DELIVERED"><button type="submit">Xác nhận giao</button></form></td></tr>
        <tr th:if="${#lists.isEmpty(orders)}"><td colspan="7" class="workspace-empty">Chưa có đơn được chuyển về kho.</td></tr></tbody></table></div></section>
</main></body></html>
