<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kho | Techtra</title><link rel="stylesheet" th:href="@{/css/admin/style.css}"></head>
<body><main class="admin-content" style="max-width:1200px;margin:30px auto;padding:20px">
    <h1 th:text="'Kho: ' + ${warehouse.name}">Kho</h1><a th:href="@{/warehouse/orders}">Đơn giao từ kho</a> · <a th:href="@{/}">Về cửa hàng</a>
    <div class="card"><div class="card__header"><h2>Nhập hàng vào kho</h2></div><div class="card__body">
        <form th:action="@{/warehouse/receive}" method="post">
            <label>Sản phẩm <select name="productId" required><option value="">Chọn sản phẩm</option><option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name}"></option></select></label>
            <label>Số lượng <input type="number" name="quantity" min="1" required></label>
            <label>Mã lô <input name="batchCode"></label><label>Hạn dùng <input type="date" name="expirationDate"></label>
            <label>Ghi chú <input name="note"></label><button type="submit">Ghi nhận nhập kho</button>
        </form>
    </div></div>
    <div class="card"><div class="card__header"><h2>Tồn kho</h2></div><div class="card__body"><table class="admin-table"><thead><tr><th>Sản phẩm</th><th>Tồn</th></tr></thead>
        <tbody><tr th:each="row : ${inventory}"><td th:text="${row.product.name}"></td><td th:text="${row.stockQuantity}"></td><td>
            <form th:action="@{/warehouse/transfer}" method="post"><input type="hidden" name="productId" th:value="${row.product.id}">
                <input type="number" name="quantity" min="1" th:max="${row.stockQuantity}" placeholder="SL" required>
                <select name="storeId" required><option value="">Chọn chi nhánh</option><option th:each="store : ${stores}" th:value="${store.id}" th:text="${store.name}"></option></select>
                <input name="note" placeholder="Ghi chú"><button type="submit">Tạo phiếu chuyển</button></form>
        </td></tr><tr th:if="${#lists.isEmpty(inventory)}"><td colspan="3">Kho chưa có tồn hàng.</td></tr></tbody></table></div></div>
    <div class="card"><div class="card__header"><h2>Phiếu điều chuyển đã tạo</h2></div><div class="card__body"><table class="admin-table"><thead><tr><th>Mã</th><th>Sản phẩm</th><th>Chi nhánh</th><th>Số lượng</th><th>Trạng thái</th></tr></thead>
        <tbody><tr th:each="transfer : ${transfers}"><td th:text="${transfer.id}"></td><td th:text="${transfer.product.name}"></td><td th:text="${transfer.destinationStore.name}"></td><td th:text="${transfer.quantity}"></td><td th:text="${transfer.status}"></td></tr></tbody></table></div></div>
</main></body></html>
