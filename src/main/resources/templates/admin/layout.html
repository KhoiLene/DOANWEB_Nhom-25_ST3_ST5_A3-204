<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Admin KL Shop'">Admin KL Shop</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/style.css}">
</head>
<body>
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar__brand">
                <i class="fa-solid fa-gauge-high"></i>
                <span>KL Admin</span>
            </div>

            <ul class="admin-sidebar__menu">
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/dashboard}" class="admin-sidebar__link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                        <i class="fa-solid fa-house"></i>
                        <span>Bảng điều khiển</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/categories}" class="admin-sidebar__link" th:classappend="${activePage == 'categories' ? 'active' : ''}">
                        <i class="fa-solid fa-list"></i>
                        <span>Danh mục</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/products}" class="admin-sidebar__link" th:classappend="${activePage == 'products' ? 'active' : ''}">
                        <i class="fa-solid fa-box"></i>
                        <span>Sản phẩm</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/orders}" class="admin-sidebar__link" th:classappend="${activePage == 'orders' ? 'active' : ''}">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Đơn hàng</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/users}" class="admin-sidebar__link" th:classappend="${activePage == 'users' ? 'active' : ''}">
                        <i class="fa-solid fa-users"></i>
                        <span>Người dùng</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/settings}" class="admin-sidebar__link" th:classappend="${activePage == 'settings' ? 'active' : ''}">
                        <i class="fa-solid fa-gear"></i>
                        <span>Cài đặt hệ thống</span>
                    </a>
                </li>
            </ul>

            <div class="admin-sidebar__footer">
                <a th:href="@{/}" class="admin-sidebar__link">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Quay lại Store</span>
                </a>
            </div>
        </aside>

        <!-- Main Area -->
        <div class="admin-main">
            <header class="admin-topbar">
                <div class="admin-topbar__title" th:text="${title}">Dashboard</div>

                <div class="admin-topbar__user">
                    <div class="admin-topbar__user-info">
                        <span class="admin-topbar__user-name" th:text="${#authentication.name}">Admin User</span>
                        <span class="admin-topbar__user-role">Quản trị viên</span>
                    </div>
                    <i class="fa-solid fa-circle-user" style="font-size: 1.5rem; color: var(--admin-primary);"></i>
                </div>
            </header>

            <main class="admin-content">
                <div th:replace="${content}"></div>
            </main>
        </div>
    </div>
</body>
</html>
