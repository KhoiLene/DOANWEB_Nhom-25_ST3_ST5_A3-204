<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Techtra Beauty'">Techtra Beauty</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/style.css}">
    <link rel="stylesheet" th:href="@{/css/workspace.css}">
    <link rel="stylesheet" th:if="${activePage == 'dashboard'}" th:href="@{/css/control-tower.css}">
    <link rel="stylesheet" th:href="@{/css/assistant-widget.css}">
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <link rel="preconnect" th:if="${activePage == 'stores'}" href="https://tiles.openfreemap.org" crossorigin>
    <link rel="stylesheet" th:if="${activePage == 'stores'}" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css">
    <link rel="stylesheet" th:if="${activePage == 'stores'}" th:href="@{/css/admin/branch-management.css}">
    <script defer th:if="${activePage == 'stores'}" th:src="@{/js/nominatim-client.js}"></script>
    <script defer th:src="@{/js/assistant-widget.js}"></script>
    <script defer th:src="@{/js/theme-toggle.js}"></script>
</head>
<body class="workspace-body">
    <div class="admin-wrapper">
        <!-- Sidebar -->
        <aside class="admin-sidebar">
            <div class="admin-sidebar__brand">
                <i class="fa-solid fa-leaf"></i>
                <span>TECHTRA <strong style="color:#2563eb">BEAUTY</strong></span>
            </div>

            <ul class="admin-sidebar__menu">
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/dashboard}" class="admin-sidebar__link" th:classappend="${activePage == 'dashboard' ? 'active' : ''}">
                        <i class="fa-solid fa-house"></i>
                        <span>Trung tâm vận hành</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/categories}" class="admin-sidebar__link" th:classappend="${activePage == 'categories' ? 'active' : ''}">
                        <i class="fa-solid fa-list"></i>
                        <span>Danh mục</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/products}" class="admin-sidebar__link" th:classappend="${activePage == 'products' ? 'active' : ''}">
                        <i class="fa-solid fa-box"></i>
                        <span>Sản phẩm</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/orders}" class="admin-sidebar__link" th:classappend="${activePage == 'orders' ? 'active' : ''}">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Đơn hàng</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/invoices}" class="admin-sidebar__link" th:classappend="${activePage == 'invoices' ? 'active' : ''}">
                        <i class="fa-solid fa-receipt"></i><span>Biên nhận</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/users}" class="admin-sidebar__link" th:classappend="${activePage == 'users' ? 'active' : ''}">
                        <i class="fa-solid fa-users"></i>
                        <span>Người dùng</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/locations/stores}" class="admin-sidebar__link" th:classappend="${activePage == 'stores' ? 'active' : ''}">
                        <i class="fa-solid fa-shop"></i><span>Chi nhánh</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/locations/warehouses}" class="admin-sidebar__link" th:classappend="${activePage == 'warehouses' ? 'active' : ''}">
                        <i class="fa-solid fa-warehouse"></i><span>Kho</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/assistant-knowledge}" class="admin-sidebar__link" th:classappend="${activePage == 'assistant-knowledge' ? 'active' : ''}">
                        <i class="fa-solid fa-brain"></i><span>Kho tri thức RAG</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/messages}" class="admin-sidebar__link">
                        <i class="fa-solid fa-comments"></i><span>Tin nhắn nội bộ</span>
                    </a>
                </li>
                <li class="admin-sidebar__item">
                    <a th:href="@{/admin/settings}" class="admin-sidebar__link" th:classappend="${activePage == 'settings' ? 'active' : ''}">
                        <i class="fa-solid fa-gear"></i>
                        <span>Cài đặt hệ thống</span>
                    </a>
                </li>
            </ul>

        </aside>

        <!-- Main Area -->
        <div class="admin-main">
            <header class="admin-topbar">
                <div class="admin-topbar__title" th:text="${title}">Dashboard</div>

                <div class="admin-topbar__user">
                    <button class="theme-toggle" type="button" data-theme-toggle aria-label="Chuyển sang giao diện tối" title="Đổi giao diện"><span data-theme-icon aria-hidden="true">☾</span><span class="theme-toggle__label" data-theme-label>Giao diện tối</span></button>
                    <details class="admin-profile-menu">
                        <summary class="admin-topbar__user-info">
                            <span class="admin-topbar__user-name" th:text="${#authentication.name}">Admin User</span>
                            <span class="admin-topbar__user-role">Quản trị viên · Hồ sơ ⌄</span>
                        </summary>
                        <div class="admin-profile-menu__panel">
                            <a class="btn btn-outline" th:href="@{/}">Xem cửa hàng</a>
                            <a class="btn btn-outline" th:href="@{/messages}">Tin nhắn nội bộ</a>
                            <form th:action="@{/logout-process}" method="post"><button class="btn btn-primary" type="submit">Đăng xuất</button></form>
                        </div>
                    </details>
                </div>
            </header>

            <main class="admin-content">
                <div th:replace="${content}"></div>
            </main>
        </div>
    </div>
    <div th:replace="~{fragments/assistant-widget :: widget}"></div>
</body>
</html>
