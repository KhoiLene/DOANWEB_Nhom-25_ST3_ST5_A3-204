<div th:fragment="form">
    <div class="card">
        <div class="card__header">
            <h3 style="margin: 0;" th:text="${product.id == null ? 'Thêm sản phẩm mới' : 'Chỉnh sửa sản phẩm'}">Thêm mới</h3>
        </div>
        <div class="card__body">
            <div class="alert alert-danger" th:if="${productFormError}" th:text="${productFormError}"></div>
            <form th:action="@{/admin/products/save}" th:object="${product}" method="post" enctype="multipart/form-data">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label class="form-label">Tên sản phẩm <span style="color: red;">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập tên sản phẩm..." required>
                </div>

                <div class="form-group">
                    <label class="form-label">Danh mục <span style="color: red;">*</span></label>
                    <select name="categoryId" class="form-control" required>
                        <option value="">-- Chọn danh mục --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                                th:selected="${product.category != null and product.category.id == cat.id}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Giá bán <span style="color: red;">*</span></label>
                    <input type="number" step="0.01" th:field="*{price}" class="form-control" placeholder="Nhập giá sản phẩm..." required>
                </div>

                <div style="display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin:18px 0; padding:16px; border:1px solid #dbe7fb; border-radius:12px; background:#f8fbff;">
                    <div class="form-group">
                        <label class="form-label">Giảm giá (%)</label>
                        <input type="number" min="0.01" max="99.99" step="0.01" th:field="*{discountPercent}" class="form-control" placeholder="Để trống nếu không giảm">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Tên chương trình</label>
                        <input type="text" maxlength="120" th:field="*{campaignName}" class="form-control" placeholder="Ví dụ: Flash Sale cuối tuần">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Đối tượng áp dụng</label>
                        <select th:field="*{campaignAudience}" class="form-control">
                            <option value="ALL">Tất cả khách hàng</option>
                            <option value="VIP">Khách VIP (từ 500 điểm)</option>
                        </select>
                    </div>
                    <div class="form-group"><label class="form-label">Bắt đầu ưu đãi</label><input type="datetime-local" th:field="*{campaignStartAt}" class="form-control"></div>
                    <div class="form-group"><label class="form-label">Kết thúc ưu đãi</label><input type="datetime-local" th:field="*{campaignEndAt}" class="form-control"></div>
                </div>

                <div class="form-group"><label class="form-label">Hãng / nhãn hàng</label><input type="text" maxlength="120" th:field="*{brandName}" class="form-control" placeholder="Tên hãng in trên bao bì"></div>
                <div class="form-group"><label class="form-label">Phù hợp với</label><input type="text" maxlength="300" th:field="*{suitableFor}" class="form-control" placeholder="Ví dụ: da khô, tóc dễ rối"></div>
                <div class="form-group"><label class="form-label">Cách sử dụng</label><textarea th:field="*{usageInstructions}" class="form-control" rows="3" placeholder="Ghi đúng hướng dẫn trên nhãn sản phẩm"></textarea></div>

                <div class="form-group">
                    <label class="form-label">Mô tả</label>
                    <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Nhập mô tả chi tiết về sản phẩm..."></textarea>
                </div>

                <div class="form-group">
                    <label class="form-label">Hình ảnh sản phẩm</label>
                    <input type="file" name="imageFile" class="form-control" accept="image/*">
                    <p style="font-size: 0.8rem; color: #6c757d; margin-top: 5px;">Hãy chọn một hình ảnh rõ nét cho sản phẩm.</p>
                </div>

                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 20px;">
                    <div class="form-group">
                        <label class="form-label">
                            <input type="checkbox" th:field="*{isActive}"> Hoạt động
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="form-label">
                            <input type="checkbox" th:field="*{isFeatured}"> Sản phẩm nổi bật
                        </label>
                    </div>
                    <div class="form-group"><small class="form-label">Gắn mức giảm ở trên sẽ đưa sản phẩm vào danh sách ưu đãi.</small></div>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                    <a th:href="@{/admin/products}" class="btn btn-outline">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary">Lưu sản phẩm</button>
                </div>
            </form>
        </div>
    </div>
</div>
