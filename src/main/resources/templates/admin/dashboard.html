<div th:fragment="dashboard">
    <div class="stats-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
        <div class="card">
            <div class="card__body" style="display: flex; align-items: center; gap: 20px;">
                <div style="background: #e3f2fd; color: #1976d2; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                    <i class="fa-solid fa-box"></i>
                </div>
                <div>
                    <span style="display: block; color: #6c757d; font-size: 0.9rem;">Tổng sản phẩm</span>
                    <strong style="font-size: 1.8rem;" th:text="${totalProducts}">0</strong>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card__body" style="display: flex; align-items: center; gap: 20px;">
                <div style="background: #e8f5e9; color: #388e3c; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                    <i class="fa-solid fa-cart-shopping"></i>
                </div>
                <div>
                    <span style="display: block; color: #6c757d; font-size: 0.9rem;">Tổng đơn hàng</span>
                    <strong style="font-size: 1.8rem;" th:text="${totalOrders}">0</strong>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card__body" style="display: flex; align-items: center; gap: 20px;">
                <div style="background: #fff3e0; color: #f57c00; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5rem;">
                    <i class="fa-solid fa-users"></i>
                </div>
                <div>
                    <span style="display: block; color: #6c757d; font-size: 0.9rem;">Tổng người dùng</span>
                    <strong style="font-size: 1.8rem;" th:text="${totalUsers}">0</strong>
                </div>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card__header">
            <h3 style="margin: 0;">Chào mừng Quản trị viên!</h3>
        </div>
        <div class="card__body">
            <p>Chào mừng bạn quay trở lại với hệ thống quản trị của KL Shop. Tại đây bạn có thể quản lý toàn bộ danh mục sản phẩm, đơn hàng và người dùng của cửa hàng.</p>
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <a th:href="@{/admin/products}" class="btn btn-primary">Quản lý sản phẩm</a>
                <a th:href="@{/admin/categories}" class="btn btn-outline">Quản lý danh mục</a>
            </div>
        </div>
    </div>
</div>
