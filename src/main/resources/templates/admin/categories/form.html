<div th:fragment="form">
    <div class="card">
        <div class="card__header">
            <h3 style="margin: 0;" th:text="${category.id == null ? 'Thêm danh mục mới' : 'Chỉnh sửa danh mục'}">Thêm mới</h3>
        </div>
        <div class="card__body">
            <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label class="form-label">Tên danh mục <span style="color: red;">*</span></label>
                    <input type="text" th:field="*{name}" class="form-control" placeholder="Nhập tên danh mục..." required>
                </div>

                <div class="form-group">
                    <label class="form-label">Mô tả</label>
                    <textarea th:field="*{description}" class="form-control" rows="4" placeholder="Nhập mô tả ngắn về danh mục..."></textarea>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                    <a th:href="@{/admin/categories}" class="btn btn-outline">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary">Lưu danh mục</button>
                </div>
            </form>
        </div>
    </div>
</div>
