<div th:fragment="form">
    <div class="card">
        <div class="card__header">
            <h3 style="margin: 0;">Chỉnh sửa thông tin người dùng</h3>
        </div>
        <div class="card__body">
            <div th:if="${error}" style="padding:12px 16px;margin-bottom:16px;border-radius:10px;background:#fef2f2;color:#b91c1c" role="alert" th:text="${error}"></div>
            <form th:action="@{/admin/users/save}" method="post">
                <input type="hidden" name="id" th:value="${user.id}">

                <div class="form-group">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" name="fullName" th:value="${user.fullName}" class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" name="phone" th:value="${user.phone}" class="form-control">
                </div>

                <div class="form-group">
                    <label class="form-label">Vai trò <span style="color: red;">*</span></label>
                    <select name="roleId" class="form-control" required>
                        <option th:each="role : ${roles}" th:value="${role.id}" th:text="${role.name}" th:selected="${role.id == user.role?.id}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Cửa hàng phụ trách (chỉ dành cho nhân viên cửa hàng)</label>
                    <select name="storeId" class="form-control">
                        <option value="">-- Chọn cửa hàng --</option>
                        <option th:each="store : ${stores}" th:value="${store.id}" th:text="${store.name}"
                                th:selected="${user.store?.id == store.id}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">Kho phụ trách (chỉ dành cho nhân viên kho)</label>
                    <select name="warehouseId" class="form-control">
                        <option value="">-- Chọn kho --</option>
                        <option th:each="warehouse : ${warehouses}" th:value="${warehouse.id}" th:text="${warehouse.name}"
                                th:selected="${user.warehouse?.id == warehouse.id}"></option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label">
                        <input type="checkbox" name="enabled" th:checked="${user.enabled}"> Tài khoản đang hoạt động
                    </label>
                </div>

                <div style="display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px;">
                    <a th:href="@{/admin/users}" class="btn btn-outline">Hủy bỏ</a>
                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                </div>
            </form>
        </div>
    </div>
</div>
