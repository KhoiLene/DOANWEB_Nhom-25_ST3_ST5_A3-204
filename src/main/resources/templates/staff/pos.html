<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bán hàng tại quầy</title><link rel="stylesheet" th:href="@{/css/admin/style.css}"><style>
body{background:#f7f7fa;color:#282336;font:15px Arial,sans-serif}.wrap{max-width:1100px;margin:32px auto;padding:20px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}.card{background:white;border-radius:14px;padding:20px;box-shadow:0 4px 20px #2e19410d}.row{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.row span:first-child{flex:1}.row input{width:72px;padding:9px}.btn{background:#743b73;color:#fff;border:0;border-radius:8px;padding:10px 15px;cursor:pointer}.field{width:100%;box-sizing:border-box;padding:10px;margin:5px 0 12px;border:1px solid #ddd;border-radius:8px}.muted{color:#706a78}.total{font-size:22px;font-weight:bold}.error{color:#a21d37}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><main class="wrap">
<h1>Bán hàng tại quầy</h1><p class="muted" th:text="'Chi nhánh: ' + ${store.name}">Chi nhánh</p><p><a th:href="@{/staff/inventory}">Quản lý tồn kho</a> · <a th:href="@{/}">Về website</a></p>
<div class="grid"><section class="card"><h2>Sản phẩm tại chi nhánh</h2><div th:each="row : ${inventory}" class="row"><span><strong th:text="${row.product.name}">Sản phẩm</strong><br><small class="muted" th:text="${row.stockQuantity} + ' còn · ' + ${#numbers.formatDecimal(row.price,1,'COMMA',0,'POINT')} + ' ₫'">Tồn · giá</small></span><input type="number" min="1" th:max="${row.stockQuantity}" value="1" th:id="'qty-' + ${row.product.id}" aria-label="Số lượng"><button class="btn add-item" th:attr="data-id=${row.product.id},data-name=${row.product.name},data-price=${row.price},data-stock=${row.stockQuantity}"><span>Thêm</span></button></div><p th:if="${#lists.isEmpty(inventory)}">Chi nhánh chưa có tồn kho. Nhân viên kho cần điều chuyển hàng đến trước khi bán.</p></section>
<section class="card"><h2>Hóa đơn</h2><label>Tên khách (không bắt buộc)</label><input class="field" id="customerName"><label>Số điện thoại (không bắt buộc)</label><input class="field" id="customerPhone"><div id="cart"><p class="muted">Chưa chọn sản phẩm.</p></div><label>Thanh toán</label><select class="field" id="payment"><option value="CASH">Tiền mặt</option><option value="CARD">Thẻ</option><option value="BANK_TRANSFER">Chuyển khoản</option><option value="OTHER">Khác</option></select><p class="total">Tổng: <span id="total">0 ₫</span></p><p class="error" id="error"></p><button class="btn" onclick="checkout()">Hoàn tất và xuất biên nhận</button></section></div></main>
<script>
const basket=new Map(),fmt=n=>new Intl.NumberFormat('vi-VN').format(n)+' ₫';
document.querySelectorAll('.add-item').forEach(button=>button.addEventListener('click',()=>add(button.dataset.id,button.dataset.name,button.dataset.price,button.dataset.stock)));
function add(id,name,price,stock){const q=Number(document.getElementById('qty-'+id).value);if(q<1||q>Number(stock)){document.getElementById('error').textContent='Số lượng vượt quá tồn kho.';return}const old=basket.get(id);const next=(old?.quantity||0)+q;if(next>Number(stock)){document.getElementById('error').textContent='Số lượng trong giỏ vượt quá tồn kho.';return}basket.set(id,{productId:Number(id),name,price:Number(price),quantity:next});render()}
function render(){const el=document.getElementById('cart');let total=0;el.innerHTML='';for(const [id,x] of basket){total+=x.price*x.quantity;const p=document.createElement('p');p.textContent=x.name+' × '+x.quantity+' — '+fmt(x.price*x.quantity);const b=document.createElement('button');b.className='btn';b.textContent='Xóa';b.onclick=()=>{basket.delete(id);render()};p.append(' ',b);el.append(p)}if(!basket.size)el.innerHTML='<p class="muted">Chưa chọn sản phẩm.</p>';document.getElementById('total').textContent=fmt(total)}
async function checkout(){document.getElementById('error').textContent='';if(!basket.size){document.getElementById('error').textContent='Vui lòng thêm sản phẩm.';return}const res=await fetch('/staff/sales',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customerName:document.getElementById('customerName').value,customerPhone:document.getElementById('customerPhone').value,paymentMethod:document.getElementById('payment').value,lines:[...basket.values()].map(({productId,quantity})=>({productId,quantity}))})});if(!res.ok){const body=await res.text();document.getElementById('error').textContent=body||'Không thể hoàn tất giao dịch.';return}const data=await res.json();location.href=data.invoiceUrl}
</script></body></html>
