<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi mật khẩu thành công - Techtra Beauty</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <link rel="stylesheet" th:href="@{/css/auth-polish.css}">
    <th:block th:replace="~{fragments/header :: header-assets}"></th:block>
    <th:block th:replace="~{fragments/footer :: footer-assets}"></th:block>
</head>
<body>
  <div th:replace="~{fragments/header :: header}"></div>
  <main class="auth-page auth-page--forgot">
    <aside class="auth-visual">
      <div class="auth-visual__brand"><span class="brand-mark"><i class="fa-solid fa-spa"></i></span><span>TECHTRA <strong>BEAUTY</strong></span></div>
      <div class="auth-visual__content"><span class="auth-visual__eyebrow">Tài khoản an toàn</span><h1 class="auth-visual__title">Chào mừng bạn <span>trở lại</span></h1><p class="auth-visual__desc">Mật khẩu mới đã được cập nhật. Bạn có thể đăng nhập và tiếp tục mua sắm.</p></div>
      <div class="auth-visual__footer"><i class="fa-solid fa-leaf"></i><span>Chăm sóc mỗi ngày, theo cách của bạn.</span></div>
    </aside>
    <section class="auth-form-wrap">
      <div class="auth-form password-reset-done">
        <span class="password-reset-done__icon"><i class="fa-solid fa-circle-check"></i></span>
        <span class="auth-form__eyebrow">ĐÃ CẬP NHẬT</span>
        <h2 class="auth-form__heading">Đổi mật khẩu thành công</h2>
        <p class="auth-form__sub" th:text="${message}">Mật khẩu đã được đặt lại. Vui lòng đăng nhập lại.</p>
        <a th:href="@{/login}" class="btn btn-primary"><span>Đăng nhập</span><i class="fa-solid fa-arrow-right"></i></a>
      </div>
    </section>
  </main>
  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
