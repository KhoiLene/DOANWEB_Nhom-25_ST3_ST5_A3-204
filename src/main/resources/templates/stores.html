<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Hệ thống cửa hàng | Techtra Beauty</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/store-locator.css}">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
    <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script defer th:src="@{/js/nominatim-client.js}"></script>
    <th:block th:replace="~{fragments/header :: header-assets}"></th:block>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="store-locator container section-padding" id="store-locator">
    <div class="store-locator__heading">
        <div><span class="store-locator__eyebrow">TECHTRA BEAUTY</span><h1>Tìm cửa hàng gần bạn</h1>
            <p>Dùng vị trí hiện tại hoặc nhập địa chỉ để xem tối đa 5 chi nhánh phù hợp.</p></div>
        <button class="btn btn-primary" type="button" id="locateMe">Dùng vị trí hiện tại</button>
    </div>
    <form id="addressSearch" class="store-locator__search" role="search">
        <label class="sr-only" for="addressQuery">Địa chỉ hoặc khu vực</label>
        <input class="form-control" id="addressQuery" autocomplete="street-address" placeholder="Nhập địa chỉ, quận hoặc tỉnh/thành">
        <button class="btn btn-outline" type="submit">Tìm cửa hàng</button>
    </form>
    <p class="store-locator__message" id="locationMessage" role="status" aria-live="polite"></p>
    <div class="store-locator__layout">
        <section class="store-locator__results" aria-label="Chi nhánh gần nhất">
            <h2>Chi nhánh gợi ý</h2><div id="storeResults" class="store-locator__cards"></div>
        </section>
        <div class="store-locator__map-wrap">
            <div id="storeMap" class="store-locator__map" role="region" aria-label="Bản đồ chi nhánh"></div>
            <p class="store-locator__map-note" id="mapMessage">Bản đồ dùng dữ liệu OpenStreetMap. Tìm địa chỉ chỉ gửi yêu cầu khi bạn bấm nút tìm.</p>
        </div>
    </div>
</main>
<div th:replace="~{fragments/footer :: footer}"></div>
<script defer th:src="@{/js/store-locator.js}"></script>
</body></html>
