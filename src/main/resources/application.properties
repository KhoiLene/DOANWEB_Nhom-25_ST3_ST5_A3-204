spring.application.name=WEB

spring.docker.compose.enabled=${SPRING_DOCKER_COMPOSE_ENABLED:true}
server.forward-headers-strategy=framework

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shop_chain_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=${PORT:8080}

# Set JWT_SECRET for a stable signing key. Without it, local development uses a per-process random key.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.security.public-origin=${APP_PUBLIC_ORIGIN:${RENDER_EXTERNAL_URL:http://localhost:8080}}

# Optional, one-time local administrator provisioning. Do not commit these values.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Integrations are supplied from environment variables outside local development.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
vnpay.vnp_url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return_url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay-return}
vnpay.tmn_code=${VNPAY_TMN_CODE:}
vnpay.hash_secret=${VNPAY_HASH_SECRET:}

# Configure these in the deployment environment; MailSender is available locally as well.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

shipping.store-fulfillment-radius-km=${STORE_FULFILLMENT_RADIUS_KM:50}

# Customer holds are temporary; scheduled expiry releases uncollected units back to available stock.
reservation.hold-minutes=${RESERVATION_HOLD_MINUTES:30}
reservation.expiry-scan-ms=${RESERVATION_EXPIRY_SCAN_MS:60000}

# Gemini Developer API. Keep GEMINI_API_KEY in the process environment, never in source control.
assistant.gemini.api-key=${GEMINI_API_KEY:}
assistant.gemini.chat-model=${ASSISTANT_CHAT_MODEL:gemini-3.5-flash-lite}
assistant.gemini.embedding-model=${ASSISTANT_EMBEDDING_MODEL:gemini-embedding-2}
assistant.gemini.embedding-dimensions=${ASSISTANT_EMBEDDING_DIMENSIONS:768}
assistant.gemini.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
assistant.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}
assistant.rag.vector.enabled=${ASSISTANT_VECTOR_ENABLED:true}
assistant.rag.collection=${ASSISTANT_QDRANT_COLLECTION:techtra_knowledge_gemini_embedding_2_768}
assistant.rag.top-k=${ASSISTANT_RAG_TOP_K:6}
assistant.rag.similarity-threshold=${ASSISTANT_RAG_SIMILARITY_THRESHOLD:0.35}
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_GRPC_PORT:6334}
spring.ai.vectorstore.qdrant.api-key=${QDRANT_API_KEY:}
spring.ai.vectorstore.qdrant.use-tls=${QDRANT_USE_TLS:false}
spring.ai.vectorstore.qdrant.collection-name=${ASSISTANT_QDRANT_COLLECTION:techtra_knowledge_gemini_embedding_2_768}
spring.ai.vectorstore.qdrant.initialize-schema=true

spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:1}
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
