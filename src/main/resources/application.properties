spring.application.name=WEB

spring.docker.compose.enabled=true

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/shop_chain_db
spring.datasource.username=postgres
spring.datasource.password=secretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=8080

# JWT secret must be at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-real-32-byte-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Optional, one-time local administrator provisioning. Do not commit these values.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Integrations are supplied from environment variables outside local development.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
vnpay.vnp_url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return_url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay-return}
vnpay.tmn_code=${VNPAY_TMN_CODE:}
vnpay.hash_secret=${VNPAY_HASH_SECRET:}

# Configure these in the deployment environment; MailSender is available locally as well.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

# Optional Google Maps JavaScript API browser key; restrict it by site referrer and enabled APIs.
maps.google.browser-key=${GOOGLE_MAPS_BROWSER_KEY:}
shipping.store-fulfillment-radius-km=${STORE_FULFILLMENT_RADIUS_KM:50}

# Optional role-scoped RAG assistants. Keep secrets and vector store IDs outside source control.
assistant.openai.api-key=${OPENAI_API_KEY:}
assistant.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
assistant.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
assistant.openai.vector-stores.customer=${OPENAI_VECTOR_STORE_CUSTOMER:}
assistant.openai.vector-stores.store-staff=${OPENAI_VECTOR_STORE_STORE_STAFF:}
assistant.openai.vector-stores.warehouse=${OPENAI_VECTOR_STORE_WAREHOUSE:}
assistant.openai.vector-stores.admin=${OPENAI_VECTOR_STORE_ADMIN:}

spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
