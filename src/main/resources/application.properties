spring.application.name=WEB

spring.docker.compose.enabled=true

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/shop_chain_db
spring.datasource.username=postgres
spring.datasource.password=secretpassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=8080

# JWT secret must be at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-real-32-byte-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Optional, one-time local administrator provisioning. Do not commit these values.
app.bootstrap-admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

# Integrations are supplied from environment variables outside local development.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
vnpay.vnp_url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return_url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay-return}
vnpay.tmn_code=${VNPAY_TMN_CODE:}
vnpay.hash_secret=${VNPAY_HASH_SECRET:}

# Configure these in the deployment environment; MailSender is available locally as well.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

shipping.store-fulfillment-radius-km=${STORE_FULFILLMENT_RADIUS_KM:50}

# Gemini Developer API. Keep GEMINI_API_KEY in the process environment, never in source control.
assistant.gemini.api-key=${GEMINI_API_KEY:}
assistant.gemini.chat-model=${ASSISTANT_CHAT_MODEL:gemini-3.1-flash-lite}
assistant.gemini.embedding-model=${ASSISTANT_EMBEDDING_MODEL:gemini-embedding-2}
assistant.gemini.embedding-dimensions=${ASSISTANT_EMBEDDING_DIMENSIONS:768}
assistant.gemini.base-url=${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com}
assistant.gemini.timeout-seconds=${GEMINI_TIMEOUT_SECONDS:30}
assistant.rag.vector.enabled=${ASSISTANT_VECTOR_ENABLED:true}
assistant.rag.collection=${ASSISTANT_QDRANT_COLLECTION:techtra_knowledge_gemini_embedding_2_768}
assistant.rag.top-k=${ASSISTANT_RAG_TOP_K:6}
assistant.rag.similarity-threshold=${ASSISTANT_RAG_SIMILARITY_THRESHOLD:0.35}
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_GRPC_PORT:6334}
spring.ai.vectorstore.qdrant.collection-name=${ASSISTANT_QDRANT_COLLECTION:techtra_knowledge_gemini_embedding_2_768}
spring.ai.vectorstore.qdrant.initialize-schema=true

spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=30000
