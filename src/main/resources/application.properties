spring.application.name=WEB

spring.docker.compose.enabled=true

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5433/shop_chain_db?options=-c%20TimeZone=Asia/Ho_Chi_Minh
spring.datasource.username=shop_user
spring.datasource.password=shoppassword
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Server Configuration
server.port=8080

# JWT secret must be at least 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-a-real-32-byte-value}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Integrations are supplied from environment variables outside local development.
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
vnpay.vnp_url=${VNPAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return_url=${VNPAY_RETURN_URL:http://localhost:8080/api/payment/vnpay-return}
vnpay.tmn_code=${VNPAY_TMN_CODE:}
vnpay.hash_secret=${VNPAY_HASH_SECRET:}

# Configure these in the deployment environment; MailSender is available locally as well.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
