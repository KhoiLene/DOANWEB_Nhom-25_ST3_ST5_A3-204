services:
  db:
    image: postgres:16
    container_name: shop-chain-db
    restart: always
    environment:
      POSTGRES_DB: shop_chain_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - shop-network

  redis:
    image: redis:alpine
    container_name: shop-chain-redis
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - shop-network

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: techtra-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - techtra_qdrant_data:/qdrant/storage
    networks:
      - shop-network

networks:
  shop-network:
    driver: bridge

volumes:
  db_data:
  techtra_qdrant_data:
