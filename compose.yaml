services:
  postgres:
    image: postgres:16
    container_name: shop-chain-db
    environment:
      POSTGRES_DB: shop_chain_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d shop_chain_db"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - web_db_data:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: techtra-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - techtra_qdrant_data:/qdrant/storage

volumes:
  web_db_data:
  techtra_qdrant_data:
